apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-custom-config-{{ .Values.environment }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dda-nginx-ingress.labels" . | nindent 4 }}
data:
  # Tuned per environment via values-<env>.yaml
  proxy-read-timeout: {{ index .Values.ingress.annotations "nginx.ingress.kubernetes.io/proxy-read-timeout" | default "60" | quote }}
  proxy-connect-timeout: {{ index .Values.ingress.annotations "nginx.ingress.kubernetes.io/proxy-connect-timeout" | default "10" | quote }}
  proxy-send-timeout: {{ index .Values.ingress.annotations "nginx.ingress.kubernetes.io/proxy-send-timeout" | default "60" | quote }}
  proxy-body-size: {{ index .Values.ingress.annotations "nginx.ingress.kubernetes.io/proxy-body-size" | default "10m" | quote }}
  use-forwarded-headers: "true"
  compute-full-forwarded-for: "true"
