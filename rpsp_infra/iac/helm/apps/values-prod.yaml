global:
  environment: prod
  imagePullPolicy: Always

services:
  employee:
    replicas: 3
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    env:
      SPRING_PROFILES_ACTIVE: prod
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      targetCPUUtilizationPercentage: 60
    pdb:
      enabled: true
      minAvailable: 2

  project:
    replicas: 3
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    env:
      SPRING_PROFILES_ACTIVE: prod
    hpa:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      targetCPUUtilizationPercentage: 60
    pdb:
      enabled: true
      minAvailable: 2

  budget:
    replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi
    env:
      SPRING_PROFILES_ACTIVE: prod
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 60
    pdb:
      enabled: true
      minAvailable: 1
