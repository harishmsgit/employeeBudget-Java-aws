services:
  postgres:
    image: postgres:16
    container_name: local-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  employee-service:
    build:
      context: ..
      dockerfile: services/employee-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/employee_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP: host.docker.internal:9092
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  project-service:
    build:
      context: ..
      dockerfile: services/project-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/project_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP: host.docker.internal:9092
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  budget-service:
    build:
      context: ..
      dockerfile: services/budget-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/budget_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP: host.docker.internal:9092
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: