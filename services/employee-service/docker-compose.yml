version: '3.9'

services:
  employee-service:
    build:
      context: ../..
      dockerfile: services/employee-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/employee_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP: host.docker.internal:9092
    ports:
      - "8081:8081"