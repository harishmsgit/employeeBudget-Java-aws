version: '3.9'

services:
  project-service:
    build:
      context: ../..
      dockerfile: services/project-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/project_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP: host.docker.internal:9092
    ports:
      - "8082:8082"