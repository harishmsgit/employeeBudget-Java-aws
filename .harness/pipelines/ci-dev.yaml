pipeline:
  name: ci-dev
  identifier: ci_dev
  projectIdentifier: default_project
  orgIdentifier: default
  properties:
    ci:
      codebase:
        connectorRef: account.github_connector
        repoName: https://github.com/harishmsgit/employeeBudget-Java-aws
        build:
          type: branch
          spec:
            branch: master
  stages:
  - stage:
      name: Build Push And Update Dev GitOps
      identifier: build_push_update_dev
      type: CI
      spec:
        cloneCodebase: true
        infrastructure:
          type: KubernetesDirect
          spec:
            connectorRef: account.k8s_delegate_connector
            namespace: harness-delegate-ng
            automountServiceAccountToken: true
            os: Linux
        execution:
          steps:
          - step:
              name: Setup Tools
              identifier: setup_tools
              type: Run
              spec:
                shell: Sh
                image: alpine:3.20
                command: |
                  apk add --no-cache bash git curl jq docker-cli
          - step:
              name: Build And Push Service Image
              identifier: build_push_service
              type: Run
              strategy:
                matrix:
                  service:
                  - employee-service
                  - project-service
                  - budget-service
              spec:
                shell: Sh
                image: maven:3.9.8-eclipse-temurin-21
                command: |
                  set -euo pipefail
                  SERVICE="<+matrix.service>"
                  AWS_REGION="<+pipeline.variables.AWS_REGION>"
                  AWS_ACCOUNT_ID="<+pipeline.variables.AWS_ACCOUNT_ID>"
                  ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
                  IMAGE_TAG="<+codebase.commitSha>"

                  echo "Building ${SERVICE}"
                  cd services/${SERVICE}
                  mvn -B clean package -DskipTests
                  cd ../..

                  echo "Configuring AWS credentials using role"
                  export AWS_REGION="${AWS_REGION}"
                  aws sts assume-role --role-arn "<+secrets.getValue('account.AWS_ROLE_ARN')>" --role-session-name harness-ci >/tmp/creds.json
                  export AWS_ACCESS_KEY_ID=$(cat /tmp/creds.json | jq -r .Credentials.AccessKeyId)
                  export AWS_SECRET_ACCESS_KEY=$(cat /tmp/creds.json | jq -r .Credentials.SecretAccessKey)
                  export AWS_SESSION_TOKEN=$(cat /tmp/creds.json | jq -r .Credentials.SessionToken)

                  aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

                  IMAGE="${ECR_REGISTRY}/${SERVICE}:${IMAGE_TAG}"
                  docker build -f services/${SERVICE}/Dockerfile -t "${IMAGE}" .
                  docker push "${IMAGE}"
          - step:
              name: Update Dev Overlay Tags
              identifier: update_dev_overlay
              type: Run
              spec:
                shell: Sh
                image: alpine:3.20
                command: |
                  set -euo pipefail
                  apk add --no-cache git
                  IMAGE_TAG="<+codebase.commitSha>"
                  FILE="gitops/overlays/dev/kustomization.yaml"

                  sed -i "s/newTag: .*/newTag: ${IMAGE_TAG}/g" "${FILE}"

                  git config user.name "harness-bot"
                  git config user.email "harness-bot@company.com"
                  git remote set-url origin "https://x-access-token:<+secrets.getValue('account.GITHUB_TOKEN')>@github.com/harishmsgit/employeeBudget-Java-aws.git"
                  git add "${FILE}"
                  git commit -m "chore(gitops): update dev image tags ${IMAGE_TAG}" || echo "No changes to commit"
                  git push origin HEAD:main
  variables:
  - name: AWS_REGION
    type: String
    value: ap-south-1
  - name: AWS_ACCOUNT_ID
    type: String
    value: "495013583028"
