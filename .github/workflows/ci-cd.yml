name: ci-cd

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: 495013583028.dkr.ecr.us-east-1.amazonaws.com

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [employee-service, project-service, budget-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build jar
        run: |
          cd services/${{ matrix.service }}
          mvn -B clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE=${ECR_REGISTRY}/${{ matrix.service }}:${GITHUB_SHA}
          docker build -f services/${{ matrix.service }}/Dockerfile -t ${IMAGE} .
          docker push ${IMAGE}

  update-gitops-dev:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in dev overlay
        run: |
          sed -i "s/newTag: .*/newTag: ${GITHUB_SHA}/g" gitops/overlays/dev/kustomization.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add gitops/overlays/dev/kustomization.yaml
          git commit -m "chore(gitops): update dev image tags ${GITHUB_SHA}" || echo "No changes"
          git push
