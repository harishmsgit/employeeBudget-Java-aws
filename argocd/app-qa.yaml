apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dda-app-qa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/harishmsgit/employeeBudget-Java-aws.git
    targetRevision: main
    path: gitops/overlays/qa
  destination:
    server: https://kubernetes.default.svc
    namespace: dda-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
