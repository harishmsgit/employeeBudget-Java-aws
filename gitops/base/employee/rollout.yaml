apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: employee-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-service
  template:
    metadata:
      labels:
        app: employee-service
    spec:
      containers:
      - name: employee-service
          image: 495013583028.dkr.ecr.us-east-1.amazonaws.com/employee-service:latest
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: employee-db-url
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: db-password
        - name: KAFKA_BOOTSTRAP
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: kafka-bootstrap
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
  strategy:
    blueGreen:
      activeService: employee-service
      previewService: employee-service-preview
      autoPromotionEnabled: false
